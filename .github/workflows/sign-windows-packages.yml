name: Sign Windows Packages

on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: SignPath signing policy slug
        required: true
        type: string
        default: test-signing

jobs:
  sign-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_vs2026_x64
            os: windows-2025-vs2026
            build_type: Release
            vs_arch: x64
            vs_version: 18
            qt_version: 6.11.1
            qt_arch_aqt: win64_msvc2022_64
            qt_arch_dir: msvc2022_64
            qt_modules: qtimageformats qtmultimedia qtpositioning qtserialport
            conan_profile: scwx-windows_vs2026_x64
            windows_artifact_name: supercell-wx-windows-vs2026-x64
            signed_windows_artifact_name: supercell-wx-signed-windows-vs2026-x64
            unsigned_installer_artifact_name: supercell-wx-installer-unsigned-windows-vs2026-x64
            signed_installer_artifact_name: supercell-wx-installer-signed-windows-vs2026-x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      SIGNED_ARTIFACTS_DIR: ${{ github.workspace }}\signed-artifacts
      SIGNED_INSTALLER_DIR: ${{ github.workspace }}\signed-installer
      SIGNPATH_ORGANIZATION_ID: 7b83cc63-b02a-4b77-a91f-808f4b4db14c
      SIGNPATH_PROJECT: supercell-wx
      SIGNPATH_SIGNING_POLICY: ${{ inputs.signing-policy || 'test-signing' }}

    steps:
    - name: Setup
      shell: pwsh
      run: git config --global core.longpaths true

    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: source
        submodules: recursive

    - name: Install Qt
      uses: jdpurcell/install-qt-action@v5
      env:
        AQT_CONFIG: ${{ github.workspace }}/source/tools/aqt-settings.ini
      with:
        version: ${{ matrix.qt_version }}
        arch: ${{ matrix.qt_arch_aqt }}
        modules: ${{ matrix.qt_modules }}
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e

    - name: Setup MSVC
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsPath) { throw "Visual Studio with C++ tools not found" }

        $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
        if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd not found at $vsDevCmd" }

        $arch = if ("${{ matrix.vs_arch }}" -eq "x64") { "amd64" } else { "${{ matrix.vs_arch }}" }

        cmd.exe /d /s /c """$vsDevCmd"" -arch=$arch -host_arch=$arch && set" |
          ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

    - name: Setup Python Environment
      shell: pwsh
      run: |
        pip install geopandas `
                    GitPython `
                    conan

    # Do not use cache for Conan packages for the signing workflow for traceability purposes
    - name: Install Conan Packages
      shell: pwsh
      run: |
        conan config install `
          ./source/tools/conan/profiles/${{ matrix.conan_profile }} `
          -tf profiles
        mkdir build
        cd build
        mkdir conan
        conan install ../source/ `
          --remote conancenter `
          --build missing `
          --profile:all ${{ matrix.conan_profile }} `
          --settings:all build_type=${{ matrix.build_type }} `
          --output-folder ./conan/
        conan cache clean

    - name: Build Supercell Wx
      shell: pwsh
      run: |
        cd build
        cmake ../source/ `
          -G Ninja `
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/source/external/cmake-conan/conan_provider.cmake" `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/supercell-wx" `
          -DCONAN_HOST_PROFILE="${{ matrix.conan_profile }}" `
          -DCONAN_BUILD_PROFILE="${{ matrix.conan_profile }}"
        ninja supercell-wx wxtest

    - name: Install Supercell Wx
      shell: pwsh
      run: |
        cd build
        cmake --install . --component supercell-wx

    - name: Upload Unsigned Artifacts (Windows)
      id: upload-unsigned-windows-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.windows_artifact_name }}
        path: ${{ github.workspace }}/supercell-wx/

    - name: Upload Debug Artifacts (Windows)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.windows_artifact_name }}-debug
        path: ${{ github.workspace }}/build/Release/bin/*.pdb

    - name: Sign Artifacts (Windows)
      id: sign-windows-artifacts
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token:           ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id:     ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug:        ${{ env.SIGNPATH_PROJECT }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
        artifact-configuration-slug: binary-archive
        github-artifact-id: ${{ steps.upload-unsigned-windows-artifacts.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ env.SIGNED_ARTIFACTS_DIR }}

    - name: Upload Signed Artifacts (Windows)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.signed_windows_artifact_name }}
        path: ${{ env.SIGNED_ARTIFACTS_DIR }}

    - name: Configure Packaging (Windows)
      shell: pwsh
      run: |
        cd build
        cmake ../source/ `
          -G Ninja `
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/source/external/cmake-conan/conan_provider.cmake" `
          -DCMAKE_INSTALL_PREFIX="${{ env.SIGNED_ARTIFACTS_DIR }}" `
          -DCONAN_HOST_PROFILE="${{ matrix.conan_profile }}" `
          -DCONAN_BUILD_PROFILE="${{ matrix.conan_profile }}" `
          -DSCWX_WINDOWS_PACKAGE_INSTALL_ROOT="${{ env.SIGNED_ARTIFACTS_DIR }}"

    - name: Build Installer (Windows)
      shell: pwsh
      run: |
        cd build
        cpack

    - name: Upload Unsigned Installer (Windows)
      id: upload-unsigned-installer
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.unsigned_installer_artifact_name }}
        path: ${{ github.workspace }}/build/supercell-wx-*.msi*

    - name: Sign Installer (Windows)
      id: sign-windows-installer
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token:           ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id:     ${{ env.SIGNPATH_ORGANIZATION_ID }}
        project-slug:        ${{ env.SIGNPATH_PROJECT }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
        artifact-configuration-slug: windows-installer-archive
        github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ env.SIGNED_INSTALLER_DIR }}

    - name: Upload Signed Installer (Windows)
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.signed_installer_artifact_name }}
        path: ${{ env.SIGNED_INSTALLER_DIR }}/**/*.msi
