name: clang-tidy-review

on:
  pull_request:
    branches:
      - 'develop'

concurrency:
  # Cancel in-progress jobs for the same pull request
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux_clang-tidy_x64
            os: ubuntu-24.04
            build_type: Release
            env_cc: clang-22
            env_cxx: clang++-22
            qt_version: 6.11.1
            qt_arch_aqt: linux_gcc_64
            qt_modules: qtimageformats qtmultimedia qtpositioning qtserialport
            qt_tools: ''
            conan_package_manager: --conf tools.system.package_manager:mode=install --conf tools.system.package_manager:sudo=True
            conan_profile: scwx-linux_clang-22
            compiler_packages: ''
            clang_tidy_binary: clang-tidy-22
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.env_cc }}
      CXX: ${{ matrix.env_cxx }}
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        path: source
        submodules: recursive
        fetch-depth: 0

    - name: Update References
      shell: bash
      run: |
        cd source
        git fetch origin develop

    - name: Checkout clang-tidy-review Repository
      uses: actions/checkout@v7
      with:
        repository: ZedThree/clang-tidy-review
        ref: v0.20.1
        path: clang-tidy-review

    - name: Install Qt
      uses: jdpurcell/install-qt-action@v5
      env:
        AQT_CONFIG: ${{ github.workspace }}/source/tools/aqt-settings.ini
      with:
        version: ${{ matrix.qt_version }}
        arch: ${{ matrix.qt_arch_aqt }}
        modules: ${{ matrix.qt_modules }}
        tools: ${{ matrix.qt_tools }}

    - name: Install LLVM 22
      shell: bash
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22 all

    - name: Setup Ubuntu Environment
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      shell: bash
      run: |
        sudo apt-get install doxygen \
                             libfuse2 \
                             ninja-build \
                             wayland-protocols \
                             libwayland-dev \
                             libwayland-egl-backend-dev \
                             ${{ matrix.compiler_packages }}
        # Remove unneeded items to free disk space
        sudo apt-get clean
        sudo rm -rf /home/runner/.rustup \
                    /usr/local/.ghcup \
                    /usr/local/lib/android \
                    /usr/share/dotnet \
                    /usr/share/swift
        df -h

    - name: Setup Python Environment
      shell: pwsh
      run: |
        pip install geopandas `
                    GitPython `
                    conan
        pip install --break-system-packages clang-tidy-review/post/clang_tidy_review

    - name: Cache Conan Packages
      uses: actions/cache@v5
      with:
        path: ~/.conan2
        key: build-v2-${{ matrix.conan_profile }}-${{ hashFiles('./source/conanfile.py', './source/tools/conan/profiles/*') }}

    - name: Install Conan Packages
      shell: pwsh
      run: |
        conan config install `
          ./source/tools/conan/profiles/${{ matrix.conan_profile }} `
          -tf profiles
        mkdir build
        cd build
        mkdir conan
        conan install ../source/ `
          --remote conancenter `
          --build missing `
          --profile:all ${{ matrix.conan_profile }} `
          --settings:all build_type=${{ matrix.build_type }} `
          --output-folder ./conan/ `
          ${{ matrix.conan_package_manager }}

    - name: Autogenerate
      shell: pwsh
      run: |
        cd build
        cmake ../source/ `
          -G Ninja `
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/source/external/cmake-conan/conan_provider.cmake" `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/supercell-wx" `
          -DCONAN_HOST_PROFILE="${{ matrix.conan_profile }}" `
          -DCONAN_BUILD_PROFILE="${{ matrix.conan_profile }}" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=on
        ninja scwx-qt_generate_counties_db `
              scwx-qt_generate_versions `
              scwx-qt_autogen

    - name: Code Review
      id: review
      shell: bash
      run: |
        cd source
        MERGE_BASE=$(git merge-base origin/develop HEAD)
        set +e
        review --clang_tidy_binary=${{ matrix.clang_tidy_binary }} \
               --token=${{ github.token }} \
               --repo='${{ github.repository }}' \
               --pr='${{ github.event.pull_request.number }}' \
               --build_dir='../build' \
               --base_dir='${{ github.workspace }}/source' \
               --clang_tidy_checks='' \
               --config_file='' \
               --include='*.[ch],*.[ch]xx,*.[chi]pp,*.[ch]++,*.cc,*.hh' \
               --exclude='' \
               --apt-packages='' \
               --cmake-command='' \
               --max-comments=25 \
               --lgtm-comment-body='' \
               --split_workflow=true \
               --annotations=false \
               --parallel=0
        REVIEW_EXIT=$?
        set -e

        if [ ! -f clang-tidy-review-output.json ]; then
          echo "GitHub PR diff unavailable (review exit ${REVIEW_EXIT}); using local git diff"
          git diff -U0 ${MERGE_BASE}...HEAD -- \
            '*.cpp' '*.cxx' '*.cc' '*.hpp' '*.h' '*.hh' '*.h++' '*.c' | \
            clang-tidy-diff-22 \
              -path ../build \
              -p1 \
              -clang-tidy-binary=${{ matrix.clang_tidy_binary }} \
              -quiet
          TIDY_EXIT=$?
          echo '{"body":"clang-tidy local git diff review","event":"COMMENT","comments":[]}' > clang-tidy-review-output.json
          echo "{\"pr_number\":${{ github.event.pull_request.number }}}" > clang-tidy-review-metadata.json
          if [ ${TIDY_EXIT} -ne 0 ]; then
            exit ${TIDY_EXIT}
          fi
        fi

        rsync -avzh --ignore-missing-args clang-tidy-review-output.json ../
        rsync -avzh --ignore-missing-args clang-tidy-review-metadata.json ../
        rsync -avzh --ignore-missing-args clang_fixes.json ../

    - name: Upload Review
      uses: ZedThree/clang-tidy-review/upload@v0.23.1

    - name: Status Check
      if: steps.review.outputs.total_comments > 0
      run: exit 1
